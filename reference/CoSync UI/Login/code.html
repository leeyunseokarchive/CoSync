<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5C4FE5",
                        "neutral-gray": "#F9FAFB",
                        "dark-text": "#111827",
                        "sub-text": "#4B5563",
                        "border-color": "#E5E7EB",
                    },
                    fontFamily: {
                        "sans": ["NanumSquareNeo", "sans-serif"],
                        "display": ["NanumSquareNeo", "sans-serif"]
                    },
                    borderRadius: {
                        '40': '40px',
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'NanumSquareNeo', sans-serif;
                background-color: #F9FAFB;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }
        .auth-card {
            background-color: #FFFFFF;
            border: 1.5px solid #F1F5F9;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05), 0 0 1px rgba(0, 0, 0, 0.1);
            border-radius: 40px; 
            width: 640px;
            z-index: 10;
        }
        .line-input {
            border: none;
            border-bottom: 1.5px solid #E5E7EB;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            transition: border-color 0.2s ease;
            background-color: transparent;
        }
        .line-input:focus {
            outline: none;
            border-bottom-color: #5C4FE5;
            box-shadow: none;
            ring: 0;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .font-neo-regular { font-weight: 400; }
        .font-neo-semibold { font-weight: 600; }
        .font-neo-bold { font-weight: 700; }
        .font-neo-extrabold { font-weight: 800; }
        .btn-shadow {
            box-shadow: 0 10px 20px -5px rgba(92, 79, 229, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center m-0 p-0 overflow-hidden relative selection:bg-primary/10 bg-[#F9FAFB]">
<nav class="fixed top-12 left-12 z-20">
<a class="group flex items-center justify-center w-12 h-12 text-slate-400 hover:text-dark-text transition-all duration-300" href="javascript:history.back()">
<span class="material-symbols-outlined text-3xl font-light">west</span>
</a>
</nav>
<main class="flex items-center justify-center w-full min-h-screen px-6">
<div class="auth-card px-20 pt-24 pb-20">
<div class="flex flex-col items-center mb-12 text-center">
<h1 class="text-[#111827] text-[32px] font-neo-extrabold mb-4 tracking-[-0.02em] leading-[1.3]">로그인</h1>
<div class="space-y-1.5">
<p class="text-sub-text text-[16px] font-neo-regular">반가워요! 다시 팀 합의를 시작해볼까요?</p>
<div class="flex items-center justify-center gap-2">
<span class="text-slate-400 text-[16px] font-neo-regular">아직 계정이 없으신가요?</span>
<a class="text-primary text-[16px] font-neo-semibold hover:opacity-80 transition-opacity" href="#">회원가입</a>
</div>
</div>
</div>
<form class="space-y-12">
<div class="space-y-10">
<div class="flex flex-col gap-2.5">
<label class="text-dark-text text-[14px] font-neo-semibold tracking-tight">이메일 주소</label>
<input class="line-input w-full text-dark-text text-[16px] py-3 placeholder:text-slate-300" placeholder="example@cosync.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2.5">
<label class="text-dark-text text-[14px] font-neo-semibold tracking-tight">비밀번호</label>
<div class="relative">
<input class="line-input w-full text-dark-text text-[16px] py-3 pr-10 placeholder:text-slate-300" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1.5">
<a class="text-[14px] text-slate-400 font-neo-regular hover:text-primary transition-colors" href="#">비밀번호를 잊으셨나요?</a>
</div>
</div>
</div>
<div class="pt-4 space-y-8">
<button class="w-full flex items-center justify-center gap-2 rounded-full bg-[#5C4FE5] h-[56px] text-white font-neo-semibold text-[16px] transition-all hover:bg-[#4E42D4] btn-shadow active:scale-[0.98]" type="submit">
<span>로그인하기</span>
<span class="material-symbols-outlined text-[20px]">east</span>
</button>
<div class="flex justify-center">
<div class="flex items-center gap-2">
<span class="text-slate-400 text-[14px] font-neo-regular">계정 정보를 잊으셨나요?</span>
<a class="text-dark-text text-[14px] font-neo-semibold hover:text-primary transition-colors" href="#">계정 찾기</a>
</div>
</div>
</div>
</form>
</div>
</main>

</body></html>
